name: Build Stobe Plugin

on:
  push:
    branches: [stobe]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - 'vendor/**'
  pull_request:
    branches: [stobe]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - 'vendor/**'
  workflow_dispatch:
    inputs:
      diag_profile:
        description: 'Diagnostic profile'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - no_hook
          - ui_only
          - no_context
          - no_hook_no_context
          - hook_no_orig

jobs:
  build:
    name: Build (v100 / ${{ github.event.inputs.diag_profile || 'normal' }})
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache MSVC v100 toolset
        id: cache-v100
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Microsoft Visual Studio 10.0
          key: msvc-v100-winsdk71-kb2519277

      - name: Install MSVC v100 (Windows SDK 7.1 + KB2519277)
        if: steps.cache-v100.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $cl       = "C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\bin\amd64\cl.exe"
          $tmp      = "C:\stobe-install-tmp"
          $extract  = "C:\sdk71-extract"
          New-Item -ItemType Directory -Path $tmp     -Force | Out-Null
          New-Item -ItemType Directory -Path $extract -Force | Out-Null

          # ── Download SDK 7.1 ISO ─────────────────────────────────────────
          $iso = "$tmp\GRMSDKX_EN_DVD.iso"
          Write-Host "[1/4] Descargando Windows SDK 7.1 ISO (~570 MB)..."
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/F/1/0/F10113F5-B750-4969-A255-274341AC6BCE/GRMSDKX_EN_DVD.iso" `
            -OutFile $iso -UseBasicParsing

          # ── Mount ISO ────────────────────────────────────────────────────
          Write-Host "[2/4] Montando ISO..."
          $mount = Mount-DiskImage -ImagePath $iso -PassThru
          $drive = ($mount | Get-Volume).DriveLetter + ":"
          Write-Host "ISO montado en: $drive"
          Write-Host "Contenido de Setup/:"
          Get-ChildItem "$drive\Setup\" | ForEach-Object { Write-Host "  $($_.Name)" }

          # ── Extract all MSIs via msiexec /a (no prerequisites needed) ───
          Write-Host "[3/4] Extrayendo MSIs (sin prerequisitos)..."
          $msiFiles = Get-ChildItem "$drive\Setup\" -Recurse -File -Filter "*.msi" -ErrorAction SilentlyContinue
          Write-Host "MSIs encontrados: $($msiFiles.Count)"
          if ($msiFiles.Count -eq 0) {
            Write-Error "No se encontraron archivos .msi dentro de $drive\Setup"
            exit 1
          }
          $msiFiles | ForEach-Object {
            $dest = "$extract\$($_.BaseName)"
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Write-Host "  msiexec /a $($_.Name)..."
            $r = Start-Process "msiexec.exe" `
              -ArgumentList "/a", "`"$($_.FullName)`"", "/qb", "TARGETDIR=`"$dest`"" `
              -Wait -PassThru
            Write-Host "  ExitCode: $($r.ExitCode)"
          }
          Dismount-DiskImage -ImagePath $iso -ErrorAction SilentlyContinue

          # ── Copy extracted VS 10.0 + SDK 7.1 dirs to expected locations ─
          Write-Host "[4/4] Copiando toolchain a ubicaciones esperadas..."

          # Find and copy Microsoft Visual Studio 10.0
          $vs10 = Get-ChildItem $extract -Recurse -Directory -Filter "Microsoft Visual Studio 10.0" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($vs10) {
            Write-Host "  Copiando VS 10.0 desde: $($vs10.FullName)"
            New-Item -ItemType Directory -Path "C:\Program Files (x86)\Microsoft Visual Studio 10.0" -Force | Out-Null
            Copy-Item "$($vs10.FullName)\*" "C:\Program Files (x86)\Microsoft Visual Studio 10.0\" -Recurse -Force
          } else {
            Write-Host "  WARN: directorio 'Microsoft Visual Studio 10.0' no encontrado en MSIs"
          }

          # Find and copy SDK v7.1
          $sdk71 = Get-ChildItem $extract -Recurse -Directory | Where-Object { $_.Name -eq 'v7.1' } |
            Select-Object -First 1
          if ($sdk71) {
            $sdkDest = "C:\Program Files\Microsoft SDKs\Windows\v7.1"
            New-Item -ItemType Directory -Path $sdkDest -Force | Out-Null
            Write-Host "  Copiando SDK 7.1 desde: $($sdk71.FullName)"
            Copy-Item "$($sdk71.FullName)\*" $sdkDest -Recurse -Force
          } else {
            Write-Host "  WARN: directorio SDK 'v7.1' no encontrado"
          }

          # Diagnostic: show all cl.exe found
          Write-Host "=== cl.exe encontrados en el sistema ==="
          Get-ChildItem "C:\Program Files (x86)\" -Recurse -Filter "cl.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }

          if (-not (Test-Path $cl)) {
            Write-Error "cl.exe NO encontrado en: $cl"
            exit 1
          }
          Write-Host "OK: cl.exe en $cl"

      - name: Validate MSVC v100 toolset
        shell: pwsh
        run: |
          $cl = "C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\bin\amd64\cl.exe"
          if (-not (Test-Path $cl)) {
            Write-Error "MSVC v100 not found at: $cl"
            exit 1
          }
          Write-Host "OK: MSVC v100 found at $cl"

      - name: Prepare locked SDK snapshot
        shell: pwsh
        run: |
          .\scripts\setup-sdk.ps1
          if (-not (Test-Path ".\vendor\stobe-sdk\Include")) {
            Write-Error "vendor/stobe-sdk was not prepared correctly"
            exit 1
          }
          Write-Host "OK: vendor/stobe-sdk ready"

      - name: Build plugin
        shell: pwsh
        run: |
          # Set up MSVC v100 environment manually (needed for Ninja generator)
          $vc  = "C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC"
          $sdk = "C:\Program Files\Microsoft SDKs\Windows\v7.1"
          $env:PATH    = "$vc\bin\amd64;$vc\bin;$env:PATH"
          $env:INCLUDE = "$vc\include;$sdk\Include"
          $env:LIB     = "$vc\lib\amd64;$sdk\Lib\x64"
          Write-Host "INCLUDE=$env:INCLUDE"
          Write-Host "LIB=$env:LIB"

          $profile = "${{ github.event.inputs.diag_profile || 'normal' }}"
          Write-Host "Building with profile: $profile (generator: Ninja)"
          $buildArgs = @('-Generator', 'Ninja')
          if ($profile -ne 'normal') { $buildArgs += @('-DiagProfile', $profile) }
          .\scripts\build-stobe-sdk.ps1 @buildArgs

      - name: Locate build output
        id: find_dll
        shell: pwsh
        run: |
          # Search for Stobe.dll in common CMake output locations
          $candidates = @(
            "build\Release\Stobe.dll",
            "build\Stobe.dll",
            "out\Release\Stobe.dll"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $found = $c; break }
          }
          if (-not $found) {
            $found = (Get-ChildItem -Recurse -Filter "Stobe.dll" | Select-Object -First 1).FullName
          }
          if (-not $found) {
            Write-Error "Stobe.dll not found after build"
            exit 1
          }
          Write-Host "DLL found: $found"
          $dir = Split-Path $found -Parent
          echo "dll_dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Collect artifacts
        shell: pwsh
        run: |
          $src  = "${{ steps.find_dll.outputs.dll_dir }}"
          $dest = "artifacts"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "$src\Stobe.dll" $dest -ErrorAction SilentlyContinue
          Copy-Item "$src\Stobe.pdb" $dest -ErrorAction SilentlyContinue
          # Include mod/ folder
          if (Test-Path "mod") {
            Copy-Item "mod" "$dest\mod" -Recurse -Force
          }
          Write-Host "Artifacts collected:"
          Get-ChildItem $dest -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stobe-${{ github.sha }}-${{ github.event.inputs.diag_profile || 'normal' }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
