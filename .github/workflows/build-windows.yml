name: Build Stobe Plugin

on:
  push:
    branches: [stobe]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - 'vendor/**'
  pull_request:
    branches: [stobe]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - 'vendor/**'
  workflow_dispatch:
    inputs:
      diag_profile:
        description: 'Diagnostic profile'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - no_hook
          - ui_only
          - no_context
          - no_hook_no_context
          - hook_no_orig

jobs:
  build:
    name: Build (v100 / ${{ github.event.inputs.diag_profile || 'normal' }})
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache MSVC v100 toolset
        id: cache-v100
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Microsoft Visual Studio 10.0
          key: msvc-v100-winsdk71-kb2519277

      - name: Install MSVC v100 (Windows SDK 7.1 + KB2519277)
        if: steps.cache-v100.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $tmp = "C:\stobe-install-tmp"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          # ── Fix: crear clave de registro que SDK 7.1 requiere ────────────
          reg add "HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full" /v "Install" /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full" /v "Version" /t REG_SZ /d "4.0.30319" /f
          reg add "HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Client" /v "Install" /t REG_DWORD /d 1 /f

          # ── Windows SDK 7.1 ISO ──────────────────────────────────────────
          Write-Host "[1/3] Descargando Windows SDK 7.1 ISO..."
          $iso = "$tmp\GRMSDKX_EN_DVD.iso"
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/F/1/0/F10113F5-B750-4969-A255-274341AC6BCE/GRMSDKX_EN_DVD.iso" `
            -OutFile $iso -UseBasicParsing
          Write-Host "[1/3] Montando ISO..."
          $mount = Mount-DiskImage -ImagePath $iso -PassThru
          $drive = ($mount | Get-Volume).DriveLetter + ":"
          Write-Host "[1/3] Instalando desde $drive\Setup\SdkSetup.exe..."
          $p = Start-Process "$drive\Setup\SdkSetup.exe" `
            -ArgumentList '/q','/norestart','/features','OptionId.WindowsSDKFor64BitTools,OptionId.WindowsSDKHeadersLibsForDesktop' `
            -Wait -PassThru
          Write-Host "[1/3] SDK 7.1 ExitCode: $($p.ExitCode)"
          Dismount-DiskImage -ImagePath $iso

          # ── KB2519277 (patch compilador x64) ────────────────────────────
          Write-Host "[2/3] Descargando KB2519277..."
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/7/5/0/75045CAB-F9AF-4B7A-A40D-74C4B264E9E0/VC-Compiler-KB2519277.exe" `
            -OutFile "$tmp\KB2519277.exe" -UseBasicParsing
          Write-Host "[2/3] Instalando KB2519277..."
          $p2 = Start-Process "$tmp\KB2519277.exe" -ArgumentList '/q','/norestart' -Wait -PassThru
          Write-Host "[2/3] KB2519277 ExitCode: $($p2.ExitCode)"

          # ── Validar ──────────────────────────────────────────────────────
          $cl = "C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\bin\amd64\cl.exe"
          if (-not (Test-Path $cl)) {
            Write-Error "[3/3] cl.exe no encontrado en: $cl"
            exit 1
          }
          Write-Host "[3/3] OK: cl.exe instalado en $cl"

      - name: Validate MSVC v100 toolset
        shell: pwsh
        run: |
          $cl = "C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\bin\amd64\cl.exe"
          if (-not (Test-Path $cl)) {
            Write-Error "MSVC v100 not found at: $cl"
            exit 1
          }
          Write-Host "OK: MSVC v100 found at $cl"

      - name: Build plugin
        shell: pwsh
        run: |
          $profile = "${{ github.event.inputs.diag_profile || 'normal' }}"
          Write-Host "Building with profile: $profile"
          if ($profile -eq 'normal') {
            .\scripts\build-stobe-sdk.ps1
          } else {
            .\scripts\build-stobe-sdk.ps1 -DiagProfile $profile
          }

      - name: Locate build output
        id: find_dll
        shell: pwsh
        run: |
          # Search for Stobe.dll in common CMake output locations
          $candidates = @(
            "build\Release\Stobe.dll",
            "build\Stobe.dll",
            "out\Release\Stobe.dll"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $found = $c; break }
          }
          if (-not $found) {
            $found = (Get-ChildItem -Recurse -Filter "Stobe.dll" | Select-Object -First 1).FullName
          }
          if (-not $found) {
            Write-Error "Stobe.dll not found after build"
            exit 1
          }
          Write-Host "DLL found: $found"
          $dir = Split-Path $found -Parent
          echo "dll_dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Collect artifacts
        shell: pwsh
        run: |
          $src  = "${{ steps.find_dll.outputs.dll_dir }}"
          $dest = "artifacts"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "$src\Stobe.dll" $dest -ErrorAction SilentlyContinue
          Copy-Item "$src\Stobe.pdb" $dest -ErrorAction SilentlyContinue
          # Include mod/ folder
          if (Test-Path "mod") {
            Copy-Item "mod" "$dest\mod" -Recurse -Force
          }
          Write-Host "Artifacts collected:"
          Get-ChildItem $dest -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stobe-${{ github.sha }}-${{ github.event.inputs.diag_profile || 'normal' }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
